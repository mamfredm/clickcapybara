/* Nav */
html,body{height:100%}

.nav{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;
 padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-left:calc(10px + env(safe-area-inset-left,0px));padding-right:calc(10px + env(safe-area-inset-right,0px));
 border-bottom:1px solid var(--grid-line);background:var(--surface);box-shadow:var(--shadow);user-select:none;z-index:20}
.brand{display:flex;align-items:center;gap:6px;font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap;min-width:0}

.wide-only{display:none}.narrow-only{display:inline-flex}

/* Main: stage (title + board) and controls always share the remaining screen */
.main{flex:1 1 0;min-height:0;min-width:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;
 padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:calc(10px + env(safe-area-inset-left,0px));padding-right:calc(10px + env(safe-area-inset-right,0px))}
.stage{flex:1 1 0;min-height:0;min-width:0;width:100%;display:flex;flex-direction:column;align-items:center}
.side{display:contents}
.main:not(.land) .topslot{order:1}.main:not(.land) .stage{order:2}.main:not(.land) .controls{order:3}
.main.land{flex-direction:row;align-items:stretch;justify-content:center;gap:16px}

.main.land .side{display:flex;flex-direction:column;justify-content:center;gap:14px;flex:none;width:250px}
.main.land .topslot{width:100%;flex-direction:column;align-items:stretch;gap:6px}
.main.land .titlebar{flex-direction:column;align-items:stretch;gap:8px}
.main.land .tl{justify-content:center}
.main.land .sizes{align-self:center}
.main.land .hint-note{position:static;margin-top:2px}
.main.land .banner{flex-direction:column;gap:4px;text-align:center}
.topslot{position:relative;flex:none;min-height:38px;display:flex;align-items:center;width:100%}
.titlebar,.banner{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.banner{padding:8px 10px;border-radius:12px;border:1px solid var(--grid-line);background:var(--surface)}
.tl{display:flex;align-items:center;gap:8px;min-width:0}
.ptitle{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.sizes{display:flex;gap:4px;background:var(--surface-subtle);padding:2px;border-radius:8px;border:1px solid var(--grid-line)}
.sizes button{padding:3px 9px;border-radius:6px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:500;color:var(--muted)}
.sizes button:hover{color:var(--ink)}

.bl{display:flex;align-items:center;gap:8px;font-size:13px}

/* Board */
.board-area{position:relative;flex:1 1 0;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none}
.board-card{--n:10;--cell:32px;--cw:60px;--ch:60px;--cf:12px;--pad:8px;flex:none;width:max-content;display:flex;flex-direction:column;border:1px solid var(--grid-line);border-radius:12px;padding:var(--pad);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.board-card.paused .hrow,.board-card.paused .brow{filter:blur(7px);pointer-events:none}
.hrow,.brow{display:flex}
.corner{flex:none;width:var(--cw);height:var(--ch);border-right:2px solid var(--grid-line-strong);border-bottom:2px solid var(--grid-line-strong);background:var(--surface-subtle);border-top-left-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:calc(var(--cf)*.85);font-family:"IBM Plex Mono",ui-monospace,monospace;overflow:hidden;white-space:nowrap}
.corner.live{background:var(--ink);color:var(--paper);font-weight:700;font-size:calc(var(--cf)*1.3)}
.cgrid{flex:none;display:grid}
.cclue{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:5px;border-bottom:2px solid var(--grid-line-strong);border-right:1px solid var(--grid-line);color:var(--ink);font-weight:600;transition:background .12s;overflow:hidden}
.cclue.thick{border-right:2px solid var(--grid-line-strong)}
.cclue span,.rclue span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:var(--cf);line-height:1.15}
.rcol{flex:none;width:var(--cw);display:flex;flex-direction:column}
.rclue{flex:1 1 0;min-height:0;display:flex;justify-content:flex-end;align-items:center;gap:calc(var(--cf)*.35);padding-right:6px;border-right:2px solid var(--grid-line-strong);border-bottom:1px solid var(--grid-line);color:var(--ink);font-weight:600;transition:background .12s;overflow:hidden;white-space:nowrap}
.rclue.thick{border-bottom:2px solid var(--grid-line-strong)}
.rclue .ic{margin-right:1px}
.cclue.done,.rclue.done{color:var(--clue-done);opacity:.6}
.cclue .ic{margin-top:2px}
.cclue.hl,.rclue.hl{background:var(--cell-hover)}
.grid-board{flex:none;width:calc(var(--cell)*var(--n));height:calc(var(--cell)*var(--n));display:grid;touch-action:none;cursor:pointer}
.cell{position:relative;min-width:0;min-height:0;border:1px solid var(--grid-line);display:flex;align-items:center;justify-content:center;user-select:none;transition:background-color .1s}
.cell.tr{border-right:2px solid var(--grid-line-strong)}.cell.tb{border-bottom:2px solid var(--grid-line-strong)}
.cell.blank{background-color:var(--paper)}.cell.xh{background-color:var(--cell-hover)}
.cell.cur{box-shadow:inset 0 0 0 2px var(--accent-ink)}
.cell.wrong{box-shadow:inset 0 0 0 2px #ef4444;background-color:#fee2e2 !important;animation:pulse 1.4s ease-in-out infinite}
.cell.hintc{box-shadow:inset 0 0 0 2px #fbbf24;background-color:#fef3c7 !important}

.foot{flex:none;width:100%;padding:5px 12px;text-align:center;border-top:1px solid var(--grid-line);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;user-select:none}

/* Modals */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

/* ===== Solver ===== */
function blocksOf(clue){return clue.length===1&&clue[0]===0?[]:clue;}
function lineClues(arr){
  const clues=[];let run=0;
  for(let i=0;i<arr.length;i++){
    if(arr[i]===1)run++;
    else if(run>0){clues.push(run);run=0;}
  }
  if(run>0)clues.push(run);
  return clues.length?clues:[0];

function cluesFor(sol){
  const n=sol.length;
  const rows=sol.map(lineClues);
  const cols=[];
  for(let c=0;c<n;c++){
    const col=[];
    for(let r=0;r<n;r++)col.push(sol[r][c]);
    cols.push(lineClues(col));

function solveLine(cells,clue){
  const n=cells.length;

  for(let i=0;i<n;i++)zeros.push(zeros[i]+(cells[i]===0?1:0));

    for(let j=0;j<=k;j++){
      if(!reach[i][j])continue;
      if(cells[i]!==1&&S[i+1][j]){canE[i]=true;reach[i+1][j]=true;}
      if(j<k){
        const end=i+b[j];
        if(!fits(i,end))continue;
        if(end===n){
          if(S[n][j+1]){for(let x=i;x<end;x++)canF[x]=true;reach[n][j+1]=true;}
        }else if(cells[end]!==1&&S[end+1][j+1]){
          for(let x=i;x<end;x++)canF[x]=true;
          canE[end]=true;
          reach[end+1][j+1]=true;
        }
      }
    }
  }
  const out=[];
  for(let i=0;i<n;i++)out.push(canF[i]&&!canE[i]?1:canE[i]&&!canF[i]?0:-1);
  return out;
}
function logicSolve(rClues,cClues,n){
  const g=[];
  for(let r=0;r<n;r++)g.push(new Array(n).fill(-1));
  let changed=true,iterations=0;
  while(changed&&iterations<n*8){
    changed=false;iterations++;
    for(let r=0;r<n;r++){
      const row=solveLine(g[r],rClues[r]);
      if(!row)return null;
      for(let c=0;c<n;c++){
        if(row[c]!==g[r][c]&&row[c]!==-1){g[r][c]=row[c];changed=true;}
      }
    }
    for(let c=0;c<n;c++){
      const col=[];
      for(let r=0;r<n;r++)col.push(g[r][c]);
      const res=solveLine(col,cClues[c]);
      if(!res)return null;
      for(let r=0;r<n;r++){
        if(res[r]!==g[r][c]&&res[r]!==-1){g[r][c]=res[r];changed=true;}
      }
    }
  }
  return g;
}
function isUniquelySolvable(sol){
  const n=sol.length;
  const clues=cluesFor(sol);
  const solved=logicSolve(clues.rows,clues.cols,n);
  if(!solved)return false;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(solved[r][c]===-1)return false;
    if(solved[r][c]!==sol[r][c])return false;
  }
  return true;
}
/* playerState: 0 empty, 1 filled, 2 flag */
function findLogicalHint(playerState,solution,rClues,cClues){
  const n=playerState.length;
  const known=[];
  for(let r=0;r<n;r++){
    const row=[];
    for(let c=0;c<n;c++){
      const v=playerState[r][c];
      row.push(v===1?1:v===2?0:-1);
    }
    known.push(row);
  }
  for(let r=0;r<n;r++){
    const d=solveLine(known[r],rClues[r]);
    if(!d)continue;
    for(let c=0;c<n;c++){
      if(known[r][c]===-1&&d[c]!==-1){
        const isFill=d[c]===1;
        const clueStr=rClues[r].join(', ');
        return {row:r,col:c,target:isFill?1:2,
          reason:isFill?T(`Row ${r+1} with clue [${clueStr}] logically requires cell ${c+1} to be filled.`,`Zeile ${r+1} mit den Zahlen [${clueStr}] erzwingt, dass Feld ${c+1} gefüllt ist.`)
                       :T(`Row ${r+1} with clue [${clueStr}] guarantees cell ${c+1} must be empty (X).`,`Zeile ${r+1} mit den Zahlen [${clueStr}] stellt sicher, dass Feld ${c+1} leer sein muss (X).`)};
      }
    }
  }
  for(let c=0;c<n;c++){
    const col=[];
    for(let r=0;r<n;r++)col.push(known[r][c]);
    const d=solveLine(col,cClues[c]);
    if(!d)continue;
    for(let r=0;r<n;r++){
      if(known[r][c]===-1&&d[r]!==-1){
        const isFill=d[r]===1;
        const clueStr=cClues[c].join(', ');
        return {row:r,col:c,target:isFill?1:2,
          reason:isFill?T(`Column ${c+1} with clue [${clueStr}] logically requires row ${r+1} to be filled.`,`Spalte ${c+1} mit den Zahlen [${clueStr}] erzwingt, dass Feld ${r+1} gefüllt ist.`)
                       :T(`Column ${c+1} with clue [${clueStr}] guarantees row ${r+1} must be empty (X).`,`Spalte ${c+1} mit den Zahlen [${clueStr}] stellt sicher, dass Feld ${r+1} leer sein muss (X).`)};
      }
    }
  }
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const p=playerState[r][c],s=solution[r][c];
    if(p===0||(p===1&&s!==1)||(p===2&&s===1)){
      return {row:r,col:c,target:s===1?1:2,
        reason:s===1?T(`Cell at row ${r+1}, column ${c+1} is part of the picture.`,`Das Feld in Zeile ${r+1}, Spalte ${c+1} gehört zum Bild.`)
                    :T(`Cell at row ${r+1}, column ${c+1} is an empty background space.`,`Das Feld in Zeile ${r+1}, Spalte ${c+1} ist leerer Hintergrund.`)};
    }
  }
  return null;
}

function picGrid(str){return str.split('|').map(row=>row.split('').map(ch=>ch==='#'?1:0));}
function generateColorMap(name,grid){
  const n=grid.length,out=[],lower=name.toLowerCase();
  for(let r=0;r<n;r++){
    const row=[];
    for(let c=0;c<n;c++){
      if(grid[r][c]===0){row.push('transparent');continue;}
      let color='#2b3428';
      if(lower.includes('heart')){color=r<2?'#ef4444':'#dc2626';}
      else if(lower.includes('tree')||lower.includes('cactus')){
        if(r>=n-2&&c>=Math.floor(n/2)-1&&c<=Math.floor(n/2)+1)color='#854d0e';
        else color=r%2===0?'#15803d':'#16a34a';
      }
      else if(lower.includes('star')||lower.includes('crown')||lower.includes('bell')||lower.includes('key')){color=r%2===0?'#eab308':'#ca8a04';}
      else if(lower.includes('apple')){if(r<2&&c>=4&&c<=6)color='#15803d';else color='#dc2626';}
      else if(lower.includes('boat')||lower.includes('sail')||lower.includes('whale')||lower.includes('fish')){color=r<n*0.6?'#f8fafc':'#0284c7';}
      else if(lower.includes('flower')){
        if(r===Math.floor(n/2)&&c===Math.floor(n/2))color='#facc15';
        else if(r>=n-2)color='#16a34a';
        else color='#ec4899';
      }
      else if(lower.includes('coffee')||lower.includes('cup')){color=r<3?'#94a3b8':'#78350f';}
      else if(lower.includes('mushroom')){color=r<n*0.6?'#dc2626':'#fef08a';}
      else if(lower.includes('rocket')||lower.includes('shuttle')){
        if(r<3)color='#dc2626';else if(r>=n-2)color='#f97316';else color='#38bdf8';
      }
      else if(lower.includes('cat')||lower.includes('owl')||lower.includes('rabbit')){color='#f59e0b';}
      else if(lower.includes('ghost')){color='#cbd5e1';}
      else if(lower.includes('diamond')){color='#38bdf8';}
      else if(lower.includes('potion')){color=r<3?'#94a3b8':'#8b5cf6';}
      else{color='#059669';}
      row.push(color);
    }
    out.push(row);
  }
  return out;
}

    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return((t^(t>>>14))>>>0)/4294967296;
  };
}
function hashStr(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function generateBlob(n,rng){
  const grid=[];
  for(let r=0;r<n;r++)grid.push(new Array(n).fill(0));
  const target=Math.round(n*n*(0.42+rng()*0.14));
  const frontier=new Map();
  function addFrontier(r,c){
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<n&&nc>=0&&nc<n&&!grid[nr][nc])frontier.set(nr+','+nc,[nr,nc]);
    });
  }
  const sr=Math.floor(n/2),sc=Math.floor(n/2);
  grid[sr][sc]=1;
  let filled=1;
  addFrontier(sr,sc);
  while(filled<target&&frontier.size>0){
    const keys=Array.from(frontier.keys());
    const pick=keys[Math.floor(rng()*keys.length)];
    const rc=frontier.get(pick);
    frontier.delete(pick);
    if(grid[rc[0]][rc[1]])continue;
    grid[rc[0]][rc[1]]=1;
    filled++;
    addFrontier(rc[0],rc[1]);
  }
  return grid;
}
function repair(sol,n,rng,mirror){
  for(let iter=0;iter<n*n*2;iter++){
    const cl=cluesFor(sol);
    const g=logicSolve(cl.rows,cl.cols,n);
    if(!g)return false;
    const unknown=[];
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(g[r][c]===-1)unknown.push([r,c]);
    if(unknown.length===0)return true;
    const p=unknown[Math.floor(rng()*unknown.length)];
    const v=sol[p[0]][p[1]]?0:1;
    sol[p[0]][p[1]]=v;
    if(mirror)sol[p[0]][n-1-p[1]]=v;
  }
  return false;
}
function generateDailyPuzzle(dateKey){
  const p=dateKey.split('-');
  const dow=new Date(+p[0],+p[1]-1,+p[2],12).getDay();
  const n=dow===0||dow===6?15:10;
  const rng=mulberry32(hashStr(dateKey));
  let sol=[];
  for(let attempt=0;attempt<30;attempt++){
    sol=generateBlob(n,rng);
    for(let r=0;r<n;r++)for(let c=0;c<n/2;c++)sol[r][n-1-c]=sol[r][c];
    if(repair(sol,n,rng,true))break;
  }
  if(sol.length===0||!repair(sol,n,rng,false)){
    for(let attempt=0;attempt<30;attempt++){
      sol=generateBlob(n,rng);
      if(repair(sol,n,rng,false))break;
    }
  }
  return {id:'daily_'+dateKey,name:'Daily '+dateKey,size:n,solution:sol,colorMap:generateColorMap('daily',sol),dateKey};
}
function getRandomPuzzleBySize(size,excludeId){
  const pack=PUZZLE_PACKS.find(p=>p.size===size)||PUZZLE_PACKS[0];
  const cand=pack.puzzles.filter(p=>p.id!==excludeId);
  return cand.length>0?cand[Math.floor(Math.random()*cand.length)]:pack.puzzles[0];
}

function playTone(freq,dur,o){
  o=o||{};
  if(!soundEnabled)return;
  const ctx=getCtx();if(!ctx)return;
  const t=ctx.currentTime+(o.delay||0);
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(freq,t);
  if(o.toFreq)osc.frequency.exponentialRampToValueAtTime(Math.max(10,o.toFreq),t+dur);
  const vol=o.vol||0.1,attack=o.attack||0.008;
  gain.gain.setValueAtTime(0.0001,t);
  gain.gain.exponentialRampToValueAtTime(vol,t+attack);
  gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(t);osc.stop(t+dur+0.05);
}

function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');
  cv.className='confetti';
  cv.width=innerWidth;cv.height=innerHeight;
  document.body.appendChild(cv);
  const ctx=cv.getContext('2d');
  const colors=['#15803d','#38bdf8','#fbbf24','#ec4899','#fcba01'];
  const ps=[];
  for(let i=0;i<70;i++){
    const a=(-90+(Math.random()-0.5)*80)*Math.PI/180,sp=9+Math.random()*9;
    ps.push({x:innerWidth/2,y:innerHeight*0.65,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:5+Math.random()*5,h:3+Math.random()*4,
      rot:Math.random()*6,vr:(Math.random()-0.5)*0.4,c:colors[i%colors.length]});
  }
  let f=0;
  (function step(){
    f++;
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{
      p.vy+=0.35;p.vx*=0.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.globalAlpha=Math.max(0,1-f/95);ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    if(f<100)requestAnimationFrame(step);else cv.remove();
  })();
}

  });
  const y=new Date();y.setDate(y.getDate()-1);
  const yk=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  return {current:(hist[todayKey()]||hist[yk])?run:0,longest};
}

function boardHTML(){
  const n=S.puzzle.size,cl=S.clues;
  const rowDone=cl.rows.map((c,r)=>lineSatisfied(S.player[r].map(v=>v===1?1:0),c));
  const colDone=cl.cols.map((c,ci)=>lineSatisfied(S.player.map(row=>row[ci]===1?1:0),c));
  const cols='grid-template-columns:repeat('+n+',var(--cell))';
  let h='<div class="board-area"><div class="board-card'+(S.paused?' paused':'')+(S.solved?' done':'')+'" style="--n:'+n+'">';
  h+='<div class="hrow"><div class="corner">'+n+'×'+n+'</div><div class="cgrid" style="'+cols+'">';
  cl.cols.forEach((clue,c)=>{
    const thick=(c+1)%5===0&&c!==n-1;
    h+='<div class="cclue'+(thick?' thick':'')+(colDone[c]?' done':'')+'" data-cc="'+c+'">'+
      clue.map(x=>'<span>'+x+'</span>').join('')+(colDone[c]?ic('check','i10 ok'):'')+'</div>';
  });
  h+='</div></div><div class="brow"><div class="rcol">';
  cl.rows.forEach((clue,r)=>{
    const thick=(r+1)%5===0&&r!==n-1;
    h+='<div class="rclue'+(thick?' thick':'')+(rowDone[r]?' done':'')+'" data-rr="'+r+'">'+
      (rowDone[r]?ic('check','i10 ok'):'')+clue.map(x=>'<span>'+x+'</span>').join('')+'</div>';
  });
  h+='</div><div class="grid-board" style="'+cols+';grid-template-rows:repeat('+n+',var(--cell))">';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)h+='<div class="cell" data-r="'+r+'" data-c="'+c+'"></div>';
  h+='</div></div></div></div>';
  return h;
}

function drawWinCanvas(){
  const cv=document.getElementById('win-cv');if(!cv)return;
  const ctx=cv.getContext('2d'),p=S.puzzle,n=p.size,px=Math.floor(cv.width/n);
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(p.solution[r][c]===1){ctx.fillStyle=p.colorMap?p.colorMap[r][c]:'#1e2a20';}
    else ctx.fillStyle='rgba(0,0,0,0.04)';
    ctx.fillRect(c*px,r*px,px-1,px-1);
  }
}

/* ===== Fit the board to whatever screen we are on ===== */
function clueW(f){
  let m=0;
  S.clues.rows.forEach(cl=>{
    let w=0;cl.forEach(x=>{w+=String(x).length*f*0.62;});
    w+=Math.max(0,cl.length-1)*f*0.35;
    if(w>m)m=w;
  });
  return m+22;
}
function clueH(f){
  let m=0;
  S.clues.cols.forEach(cl=>{if(cl.length>m)m=cl.length;});
  return m*f*1.15+22;
}
function fit(){
  const main=$app.querySelector('.main');
  if(!main||!S.puzzle)return;
  main.classList.toggle('land',main.clientWidth>main.clientHeight*1.3);
  const area=$app.querySelector('.board-area'),card=$app.querySelector('.board-card');
  if(!area||!card)return;
  const W=area.clientWidth,H=area.clientHeight;
  if(W<20||H<20)return;
  const n=S.puzzle.size;
  const pad=Math.max(3,Math.min(12,Math.round(Math.min(W,H)/40)));
  const chrome=2*pad+2;
  let cell=Math.min((W-chrome)/(n+3),(H-chrome)/(n+3)),f,cw,ch;
  for(let i=0;i<6;i++){
    f=Math.max(8,Math.min(20,cell*0.42));
    cw=Math.ceil(clueW(f));ch=Math.ceil(clueH(f));
    const next=Math.min((W-chrome-cw)/n,(H-chrome-ch)/n);
    const settled=Math.abs(next-cell)<0.5;
    cell=next;
    if(settled)break;
  }
  cell=Math.floor(Math.max(8,Math.min(cell,620/n)));
  f=Math.max(8,Math.min(20,cell*0.42));
  cw=Math.ceil(clueW(f));ch=Math.ceil(clueH(f));
  const st=card.style;
  st.setProperty('--cell',cell+'px');st.setProperty('--cw',cw+'px');st.setProperty('--ch',ch+'px');
  st.setProperty('--cf',f.toFixed(1)+'px');st.setProperty('--pad',pad+'px');
  const cardW=cw+n*cell+chrome;
  const top=$app.querySelector('.topslot');
  if(top)top.style.width=main.classList.contains('land')?'':Math.min(W,Math.max(cardW,300))+'px';
  const ctl=$app.querySelector('.controls');
  if(ctl)ctl.style.width=main.classList.contains('land')?'':Math.min(W,Math.max(cardW,320))+'px';
}

function scheduleFit(){cancelAnimationFrame(fitTimer);fitTimer=requestAnimationFrame(fit);}
window.addEventListener('resize',scheduleFit);
window.addEventListener('orientationchange',()=>setTimeout(scheduleFit,120));
if(window.visualViewport)window.visualViewport.addEventListener('resize',scheduleFit);

/* Update only the board cells & guides (used while hovering / dragging) */
function strokeLine(s){
  const [sr,sc]=s.start,[cr,cc]=s.current,dr=cr-sr,dc=cc-sc;
  if(!dr&&!dc)return [[sr,sc]];
  const line=[];
  if(Math.abs(dc)>=Math.abs(dr)){const step=dc>0?1:-1;for(let c=sc;c!==cc+step;c+=step)line.push([sr,c]);}
  else{const step=dr>0?1:-1;for(let r=sr;r!==cr+step;r+=step)line.push([r,sc]);}
  return line;
}
const FLAG_SVG='<svg class="flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>';
function paintCells(){
  const p=S.puzzle,n=p.size;
  const cells=$app.querySelectorAll('.cell');
  if(cells.length!==n*n)return;
  let strokeSet=null,line=[];
  if(S.stroke){line=strokeLine(S.stroke);strokeSet=new Set(line.map(x=>x[0]+','+x[1]));}
  cells.forEach(el=>{
    const r=+el.dataset.r,c=+el.dataset.c,cur=S.player[r][c];
    let pv=cur;
    if(strokeSet&&strokeSet.has(r+','+c)){
      const st=S.stroke,elig=st.action==='set'?(cur===0||(line.length===1&&cur!==st.target)):cur===st.target;
      if(elig)pv=st.action==='set'?st.target:0;
    }
    const solvedFill=S.solved&&p.solution[r][c]===1;
    const key=r+','+c;
    let cls='cell';
    if((c+1)%5===0&&c!==n-1)cls+=' tr';
    if((r+1)%5===0&&r!==n-1)cls+=' tb';
    if(S.solved&&!solvedFill)cls+=' bg-off';
    else if(!pv&&!solvedFill)cls+=(S.hover&&!S.solved&&(S.hover[0]===r||S.hover[1]===c))?' xh':' blank';
    if(S.cursor&&S.cursor[0]===r&&S.cursor[1]===c)cls+=' cur';
    if(S.wrong.has(key))cls+=' wrong';
    if(S.hintCell&&S.hintCell.row===r&&S.hintCell.col===c)cls+=' hintc';
    if(solvedFill)cls+=' revealed';
    el.className=cls;
    el.style.backgroundColor=solvedFill?(p.colorMap&&p.colorMap[r][c]!=='transparent'?p.colorMap[r][c]:'var(--ink)'):(pv===1?'var(--ink)':'');
    el.style.animationDelay=solvedFill?((r+c)*(n<=5?35:n<=10?20:12))+'ms':'';
    const flag=pv===2&&!S.solved;
    if(flag!==(el.dataset.f==='1')){el.innerHTML=flag?FLAG_SVG:'';el.dataset.f=flag?'1':'0';}
  });
  $app.querySelectorAll('[data-cc]').forEach(e=>e.classList.toggle('hl',!!S.hover&&S.hover[1]===+e.dataset.cc));
  $app.querySelectorAll('[data-rr]').forEach(e=>e.classList.toggle('hl',!!S.hover&&S.hover[0]===+e.dataset.rr));
  const corner=$app.querySelector('.corner');
  if(corner){
    const live=S.stroke&&line.length>=2;
    corner.textContent=live?String(line.length):n+'×'+n;
    corner.classList.toggle('live',!!live);
  }
}

/* ===== Game logic ===== */
function checkVictory(state){
  const n=S.puzzle.size,cl=S.clues;
  for(let r=0;r<n;r++)if(!lineSatisfied(state[r].map(v=>v===1?1:0),cl.rows[r]))return false;
  for(let c=0;c<n;c++)if(!lineSatisfied(state.map(row=>row[c]===1?1:0),cl.cols[c]))return false;
  return true;
}
function commitMove(changes){
  if(S.solved||!changes.length||S.paused)return;
  if(S.helpTip)markHelpSeen();
  const p=S.puzzle,n=p.size,cl=S.clues;
  S.undo=[...S.undo.slice(-30),S.player.map(r=>[...r])];
  S.redo=[];
  const next=S.player.map(r=>[...r]);
  let bad=false;
  changes.forEach(({row,col,next:v})=>{
    next[row][col]=v;
    if(S.mode==='arcade'&&v===1&&p.solution[row][col]!==1)bad=true;
  });
  if(bad){
    sfx.heartLost();
    S.lives=Math.max(0,S.lives-1);
    if(S.lives<=0){
      const id=p.id;
      setTimeout(()=>{alert(T('Game Over! You ran out of hearts. Try again!','Game Over! Du hast keine Herzen mehr. Versuch es noch einmal!'));if(S.puzzle.id===id){loadPuzzle(p,'arcade');render();}},300);
    }
  }
  if(S.autoX){
    let done=false;
    const fills=changes.filter(c=>c.next===1);
    new Set(fills.map(c=>c.row)).forEach(r=>{
      if(lineSatisfied(next[r].map(v=>v===1?1:0),cl.rows[r]))
        for(let c=0;c<n;c++)if(next[r][c]===0){next[r][c]=2;done=true;}
    });
    new Set(fills.map(c=>c.col)).forEach(c=>{
      if(lineSatisfied(next.map(row=>row[c]===1?1:0),cl.cols[c]))
        for(let r=0;r<n;r++)if(next[r][c]===0){next[r][c]=2;done=true;}
    });
    if(done)sfx.lineDone();
  }
  S.player=next;
  S.hintCell=null;S.hintReason='';
  if(S.wrong.size)S.wrong=new Set();
  if(checkVictory(next)){
    S.solved=true;S.hover=null;S.cursor=null;
    sfx.win();
    const st=S.stats,clean=!S.usedCheck&&S.mistakes===0;
    const isBest=!st.best[n]||S.elapsed<st.best[n].t;
    saveStats(Object.assign({},st,{
      solved:st.solved+1,clean:clean?st.clean+1:st.clean,
      best:Object.assign({},st.best,{[n]:isBest?{t:S.elapsed,clean}:st.best[n]}),
      last:Object.assign({},st.last,{[n]:{t:S.elapsed,clean}}),
      dailyHistory:S.mode==='daily'?Object.assign({},st.dailyHistory,{[todayKey()]:{t:S.elapsed,clean,mistakes:S.mistakes}}):st.dailyHistory,
      packProgress:p.packId?Object.assign({},st.packProgress,{[p.packId]:Array.from(new Set([...(st.packProgress[p.packId]||[]),p.id]))}):st.packProgress,
      solveLog:[...st.solveLog,{t:S.elapsed,clean,mistakes:S.mistakes,timestamp:Date.now(),puzzleId:p.id,puzzleName:p.name,size:n,mode:S.mode}]
    }));
    const id=p.id,delay=n<=5?600:n<=10?800:1100;
    setTimeout(()=>{if(S.puzzle.id===id&&S.solved){S.show.win=true;freshModal='win';render();confetti();}},delay);
  }
  render();
}
function undo(){
  if(!S.undo.length||S.solved)return;
  S.redo=[...S.redo,S.player.map(r=>[...r])];
  S.player=S.undo[S.undo.length-1];S.undo=S.undo.slice(0,-1);
  sfx.undo();render();
}
function redo(){
  if(!S.redo.length||S.solved)return;
  S.undo=[...S.undo,S.player.map(r=>[...r])];
  S.player=S.redo[S.redo.length-1];S.redo=S.redo.slice(0,-1);
  sfx.tick();render();
}
let confirmTimer=0;
function pickPuzzle(size,excludeId){
  const pack=PUZZLE_PACKS.find(p=>p.size===size)||PUZZLE_PACKS[0];
  const done=new Set();
  Object.values(S.stats.packProgress).forEach(ids=>ids.forEach(i=>done.add(i)));
  const cand=pack.puzzles.filter(p=>p.id!==excludeId);
  const fresh=cand.filter(p=>!done.has(p.id));
  const pool=fresh.length?fresh:(cand.length?cand:pack.puzzles);
  return pool[Math.floor(Math.random()*pool.length)];
}
function newPuzzle(){
  const p=S.puzzle;
  if(S.mode==='pack'&&p.packId){
    const pack=PUZZLE_PACKS.find(x=>x.id===p.packId);
    if(pack){
      const i=pack.puzzles.findIndex(x=>x.id===p.id);
      loadPuzzle(pack.puzzles[(i+1)%pack.puzzles.length],'pack');
      sfx.tick();render();return;
    }
  }
  const mode=S.mode==='daily'?'free':S.mode;
  if(S.mode==='daily')S.tab='play';
  loadPuzzle(pickPuzzle(p.size,p.id),mode);
  sfx.tick();render();
}
function nextPuzzle(){
  const p=S.puzzle;
  if(S.mode==='pack'&&p.packId){
    const pack=PUZZLE_PACKS.find(x=>x.id===p.packId);
    if(pack){
      const i=pack.puzzles.findIndex(x=>x.id===p.id);
      loadPuzzle(pack.puzzles[(i+1)%pack.puzzles.length],'pack');render();return;
    }
  }
  loadPuzzle(pickPuzzle(p.size,p.id),S.mode);render();
}
function closeModal(name){
  S.show[name]=false;
  if(name==='packs'||name==='studio')S.tab=S.mode==='daily'?'daily':'play';
  render();
}

/* ===== Events ===== */
$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(S.show.menu&&a!=='menu'&&!(a==='close'&&v==='menu'))S.show.menu=false;
  if(S.confirmNew&&a!=='newpuzzle')S.confirmNew=false;
  switch(a){
    case 'menu':S.show.menu=!S.show.menu;render();break;
    case 'darkmode':toggleDark();render();break;
    case 'tab':
      S.tab=v;
      if(v==='packs'){S.show.packs=true;freshModal='packs';}
      else if(v==='daily'){loadPuzzle(generateDailyPuzzle(todayKey()),'daily');}
      else if(v==='studio'){S.show.studio=true;freshModal='studio';}
      render();break;
    case 'sound':S.soundOn=!S.soundOn;setSoundEnabled(S.soundOn);if(S.soundOn)sfx.fill();render();break;
    case 'open':S.show[v]=true;freshModal=v;if(v==='help')markHelpSeen();render();break;
    case 'helptab':S.helpTab=v;render();break;
    case 'tipclose':markHelpSeen();render();break;
    case 'close':closeModal(v);break;
    case 'tool':S.tool=v;render();break;
    case 'undo':undo();break;
    case 'redo':redo();break;
    case 'pause':if(!S.solved){S.paused=!S.paused;render();}break;
    case 'newpuzzle':{
      if(S.solved)break;
      const dirty=S.undo.length>0||S.player.some(r=>r.some(v=>v!==0));
      if(dirty&&!S.confirmNew){
        S.confirmNew=true;
        clearTimeout(confirmTimer);
        confirmTimer=setTimeout(()=>{if(S.confirmNew){S.confirmNew=false;render();}},3000);
        render();break;
      }
      clearTimeout(confirmTimer);
      newPuzzle();break;}
    case 'check':{
      if(S.solved)break;
      S.usedCheck=true;
      const w=new Set();let count=0;
      for(let r=0;r<S.puzzle.size;r++)for(let c=0;c<S.puzzle.size;c++){
        const val=S.player[r][c],sol=S.puzzle.solution[r][c];
        if((val===1&&sol!==1)||(val===2&&sol===1)){w.add(r+','+c);count++;}
      }
      S.wrong=w;S.mistakes+=count;
      count===0?sfx.checkClean():sfx.checkBad();
      render();break;}
    case 'hint':{
      if(S.solved||S.hints<=0)break;
      const h=findLogicalHint(S.player,S.puzzle.solution,S.clues.rows,S.clues.cols);
      if(!h){alert(T('You have deduced everything possible right now! Check for any conflicts.','Du hast gerade alles Mögliche abgeleitet! Prüfe, ob es Widersprüche gibt.'));break;}
      S.hintCell=h;S.hintReason=h.reason;S.hints=Math.max(0,S.hints-1);
      sfx.hint();render();break;}
    case 'size':loadPuzzle(pickPuzzle(+v),'free');render();break;
    case 'packtab':S.packId=v;render();break;
    case 'pick':{
      const pz=PUZZLE_PACKS.flatMap(pk=>pk.puzzles).find(x=>x.id===v);
      if(pz){loadPuzzle(pz,'pack');S.show.packs=false;S.tab='play';render();}
      break;}
    case 'statstab':S.statsTab=v;render();break;
    case 'theme':setTheme(v);render();break;
    case 'gmode':
      S.mode=v;
      if(v==='zen')S.hints=99;
      if(v==='arcade')S.lives=3;
      render();break;
    case 'autox':S.autoX=!S.autoX;lsSet(KEYS.autox,String(S.autoX));render();break;
    case 'next':nextPuzzle();break;
    case 'replay':loadPuzzle(S.puzzle,S.mode);render();break;
    /* Studio */
    case 'st-size':S.studio.size=+v;S.studio.grid=blank(+v);S.studio.msg=null;render();break;
    case 'st-clear':S.studio.grid=blank(S.studio.size);S.studio.msg=null;render();break;
    case 'st-cell':{
      const r=+el.dataset.r,c=+el.dataset.c;
      S.studio.grid[r][c]=S.studio.grid[r][c]?0:1;S.studio.msg=null;render();break;}
    case 'st-test':{
      const g=S.studio.grid;
      if(!g.flat().some(x=>x===1)){S.studio.msg={text:T('Draw some pixels first!','Male erst ein paar Pixel!'),err:true};}
      else if(isUniquelySolvable(g))S.studio.msg={text:T('✓ 100% Uniquely Solvable by pure logic! Ready to play.','✓ Eindeutig und rein logisch lösbar! Bereit zum Spielen.')};
      else S.studio.msg={text:T('⚠ Clues have multiple solutions or require guessing. Try tweaking a few pixels!','⚠ Die Zahlen haben mehrere Lösungen oder erfordern Raten. Ändere ein paar Pixel!'),err:true};
      render();break;}
    case 'st-copy':{
      const code=S.studio.grid.map(r=>r.join('')).join('|');
      try{navigator.clipboard.writeText(code);S.studio.msg={text:T('Copied puzzle code to clipboard!','Rätselcode in die Zwischenablage kopiert!')};}
      catch(err){S.studio.msg={text:T('Could not copy — your browser blocked clipboard access.','Kopieren nicht möglich — dein Browser blockiert den Zugriff auf die Zwischenablage.'),err:true};}
      render();break;}
    case 'st-play':{
      const s=S.studio;
      if(!s.grid.flat().some(x=>x===1)){s.msg={text:T('Please fill at least one cell!','Bitte fülle mindestens ein Feld!'),err:true};render();break;}
      const nm=s.name.trim()||T('Custom Artwork','Eigenes Kunstwerk');
      loadPuzzle({id:'custom_'+Date.now(),name:nm,size:s.size,solution:s.grid.map(r=>[...r]),colorMap:generateColorMap(nm,s.grid),author:T('You','Du')},'free');
      S.show.studio=false;S.tab='play';render();break;}
  }
});
$app.addEventListener('input',e=>{if(e.target.id==='st-name')S.studio.name=e.target.value;});
$app.addEventListener('contextmenu',e=>{if(e.target.closest('.grid-board'))e.preventDefault();});

/* Board pointer handling (window-level so drags survive re-renders) */
function cellFromPoint(x,y,clamp){
  const b=$app.querySelector('.grid-board');if(!b)return null;
  const n=S.puzzle.size,rect=b.getBoundingClientRect();
  const col=Math.floor((x-rect.left)/(rect.width/n)),row=Math.floor((y-rect.top)/(rect.height/n));
  if(!clamp&&(row<0||col<0||row>=n||col>=n))return null;
  return [Math.max(0,Math.min(n-1,row)),Math.max(0,Math.min(n-1,col))];
}
$app.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.grid-board')||S.solved||S.paused)return;
  const cell=cellFromPoint(e.clientX,e.clientY,false);
  if(!cell)return;
  e.preventDefault();
  const [r,c]=cell;
  const right=e.button===2||e.buttons===2;
  const mode=right?'flag':S.tool,target=mode==='fill'?1:2;
  S.stroke={mode,target,action:S.player[r][c]===target?'erase':'set',start:[r,c],current:[r,c],pointerId:e.pointerId,lastLen:1};
  S.hover=[r,c];
  sfx.tick();paintCells();
});
window.addEventListener('pointermove',e=>{
  if(!S.puzzle)return;
  const cell=cellFromPoint(e.clientX,e.clientY,!!S.stroke);
  const prevH=S.hover;
  if(cell)S.hover=cell;
  else if(!S.stroke)S.hover=null;
  let changed=(prevH&&S.hover)?(prevH[0]!==S.hover[0]||prevH[1]!==S.hover[1]):prevH!==S.hover;
  if(S.stroke&&e.pointerId===S.stroke.pointerId&&cell&&(cell[0]!==S.stroke.current[0]||cell[1]!==S.stroke.current[1])){
    S.stroke.current=cell;
    const len=strokeLine(S.stroke).length;
    if(len!==S.stroke.lastLen){sfx.dragNote(len-1);S.stroke.lastLen=len;}
    changed=true;
  }
  if(changed)paintCells();
});
function endStroke(commit){
  const s=S.stroke;if(!s)return;
  const line=strokeLine(s),nextVal=s.action==='set'?s.target:0,changes=[];
  line.forEach(([r,c])=>{
    const cur=S.player[r][c];
    const elig=s.action==='set'?(cur===0||(line.length===1&&cur!==s.target)):cur===s.target;
    if(elig)changes.push({row:r,col:c,prev:cur,next:nextVal});
  });
  S.stroke=null;
  if(commit&&changes.length){
    commitMove(changes);
    nextVal===0?sfx.erase():nextVal===1?sfx.fill():sfx.flag();
  }else paintCells();
}
window.addEventListener('pointerup',e=>{if(S.stroke&&e.pointerId===S.stroke.pointerId)endStroke(true);});
window.addEventListener('pointercancel',()=>endStroke(false));

/* Keyboard */
window.addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  if(e.code==='Escape'){
    const open=Object.keys(S.show).find(k=>S.show[k]);
    if(open){closeModal(open);}
    return;
  }
  if(Object.values(S.show).some(Boolean))return;
  if((e.key==='?'||e.code==='KeyH')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();markHelpSeen();S.show.help=true;freshModal='help';render();return;}
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyY'){e.preventDefault();redo();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(S.solved||S.paused)return;
  const n=S.puzzle.size;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){
    e.preventDefault();
    let [r,c]=S.cursor||[0,0];
    if(S.cursor){
      if(e.code==='ArrowUp'||e.code==='KeyW')r=Math.max(0,r-1);
      if(e.code==='ArrowDown'||e.code==='KeyS')r=Math.min(n-1,r+1);
      if(e.code==='ArrowLeft'||e.code==='KeyA')c=Math.max(0,c-1);
      if(e.code==='ArrowRight'||e.code==='KeyD')c=Math.min(n-1,c+1);
    }
    S.cursor=[r,c];S.hover=[r,c];sfx.tick();paintCells();
  }else if(e.code==='Space'||e.code==='KeyZ'){
    if(!S.cursor)return;
    e.preventDefault();
    const [r,c]=S.cursor,cur=S.player[r][c],nx=cur===1?0:1;
    commitMove([{row:r,col:c,prev:cur,next:nx}]);
    nx===1?sfx.fill():sfx.erase();
  }else if(e.code==='KeyX'||e.code==='KeyC'){
    if(!S.cursor)return;
    e.preventDefault();
    const [r,c]=S.cursor,cur=S.player[r][c],nx=cur===2?0:2;
    commitMove([{row:r,col:c,prev:cur,next:nx}]);
    nx===2?sfx.flag():sfx.erase();
  }else if(e.code==='KeyU'){undo();}
});

/* Timer — updates the clock text only, so the board is never re-rendered under the player's finger */
setInterval(()=>{
  if(S.solved||S.paused||S.mode==='zen')return;
  S.elapsed++;
  const el=document.querySelector('[data-timer]');
  if(el)el.textContent=fmt(S.elapsed);
},1000);

/* ===== Start ===== */
loadPuzzle(PUZZLE_PACKS[1].puzzles[0],'free');
render();

})();
</script>
